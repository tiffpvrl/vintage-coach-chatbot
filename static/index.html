<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vintage Coach Bag Q&A</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: Georgia, "Times New Roman", serif;
      max-width: 640px;
      margin: 0 auto;
      padding: 1.5rem;
      background: #f8f4ef;
      color: #2c2416;
      min-height: 100vh;
    }
    h1 {
      font-size: 1.5rem;
      font-weight: 600;
      margin-bottom: 0.25rem;
      color: #5c4a32;
    }
    .subtitle {
      font-size: 0.9rem;
      color: #6b5b4a;
      margin-bottom: 1.5rem;
    }
    .chat-box {
      background: #fff;
      border: 1px solid #e0d6c8;
      border-radius: 8px;
      padding: 1rem;
      min-height: 200px;
      margin-bottom: 1rem;
      white-space: pre-wrap;
      word-wrap: break-word;
    }
    .chat-box.empty {
      color: #8a7f6f;
      font-style: italic;
    }
    .chat-box.safety {
      border-left: 4px solid #c45c3e;
      background: #fef8f6;
    }
    form {
      display: flex;
      gap: 0.5rem;
      margin-bottom: 0.5rem;
    }
    input[type="text"] {
      flex: 1;
      padding: 0.6rem 0.75rem;
      border: 1px solid #d4c9b8;
      border-radius: 6px;
      font: inherit;
      font-size: 0.95rem;
    }
    input[type="text"]:focus {
      outline: none;
      border-color: #8b7355;
      box-shadow: 0 0 0 2px rgba(139, 115, 85, 0.2);
    }
    button {
      padding: 0.6rem 1rem;
      background: #5c4a32;
      color: #fff;
      border: none;
      border-radius: 6px;
      font: inherit;
      font-weight: 600;
      cursor: pointer;
    }
    button:hover { background: #6b5b4a; }
    #clear {
      background: #8b7355;
    }
    #clear:hover { background: #6b5b4a; }
    button:disabled {
      background: #a89f8e;
      cursor: not-allowed;
    }
    .error {
      color: #b33;
      font-size: 0.9rem;
      margin-top: 0.5rem;
    }
    .status {
      font-size: 0.8rem;
      color: #6b5b4a;
      margin-top: 0.25rem;
    }
  </style>
</head>
<body>
  <h1>Vintage Coach Bag Q&A</h1>
  <p class="subtitle">Ask about serial numbers, era, hardware, damage inspection, or care for vintage Coach bags (pre-2000).</p>

  <div id="output" class="chat-box empty" aria-live="polite">Ask a question above. I can help with serial/style numbers, authenticity markers, condition, and care.</div>

  <form id="form" action="#" method="post">
    <input
      type="text"
      name="message"
      id="message"
      placeholder="e.g. What does F5D-9966 mean on my Coach bag?"
      autocomplete="off"
      required
    />
    <button type="submit" id="submit">Ask</button>
    <button type="button" id="clear">Clear</button>
  </form>

  <p id="status" class="status" aria-live="polite"></p>
  <p id="error" class="error" aria-live="assertive" hidden></p>

  <script>
    const form = document.getElementById("form");
    const messageInput = document.getElementById("message");
    const output = document.getElementById("output");
    const statusEl = document.getElementById("status");
    const errorEl = document.getElementById("error");
    const submitBtn = document.getElementById("submit");
    const clearBtn = document.getElementById("clear");

    let sessionId = null;

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const text = messageInput.value.trim();
      if (!text) return;

      output.classList.remove("empty", "safety");
      output.textContent = "…";
      statusEl.textContent = "";
      errorEl.hidden = true;
      submitBtn.disabled = true;

      try {
        const body = { message: text };
        if (sessionId) body.session_id = sessionId;

        const res = await fetch("/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(body),
        });
        const data = await res.json().catch(() => ({}));

        if (!res.ok) {
          throw new Error(data.detail || res.statusText || "Request failed");
        }

        sessionId = data.session_id;
        output.textContent = data.response || "";
        if (data.safety_triggered) {
          output.classList.add("safety");
          statusEl.textContent = "A safety message was shown for this question.";
        }
      } catch (err) {
        output.classList.add("empty");
        output.textContent = "Something went wrong.";
        errorEl.textContent = err.message;
        errorEl.hidden = false;
      } finally {
        submitBtn.disabled = false;
        messageInput.focus();
      }
    });

    clearBtn.addEventListener("click", async () => {
      if (!sessionId) {
        output.classList.add("empty");
        output.textContent = "Ask a question above. I can help with serial/style numbers, authenticity markers, condition, and care.";
        statusEl.textContent = "";
        return;
      }
      try {
        await fetch("/clear?session_id=" + encodeURIComponent(sessionId), { method: "POST" });
        sessionId = null;
        output.classList.add("empty");
        output.textContent = "Ask a question above. I can help with serial/style numbers, authenticity markers, condition, and care.";
        statusEl.textContent = "Session cleared.";
      } catch (err) {
        statusEl.textContent = "Could not clear session.";
      }
    });
  </script>
</body>
</html>
