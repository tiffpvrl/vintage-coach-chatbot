<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vintage Coach Bag Q&A</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: Georgia, "Times New Roman", serif;
      max-width: 640px;
      margin: 0 auto;
      padding: 1.5rem;
      background: #f8f4ef;
      color: #2c2416;
      min-height: 100vh;
    }
    h1 {
      font-size: 1.5rem;
      font-weight: 600;
      margin-bottom: 0.25rem;
      color: #5c4a32;
    }
    .subtitle {
      font-size: 0.9rem;
      color: #6b5b4a;
      margin-bottom: 1rem;
    }
    .chat-pane {
      background: #fff;
      border: 1px solid #e0d6c8;
      border-radius: 8px;
      padding: 1rem;
      min-height: 200px;
      max-height: 400px;
      overflow-y: auto;
      margin-bottom: 1rem;
    }
    .chat-pane.empty {
      color: #8a7f6f;
      font-style: italic;
      display: flex;
      align-items: center;
    }
    .chat-pane .message {
      margin-bottom: 1rem;
      white-space: pre-wrap;
      word-wrap: break-word;
    }
    .chat-pane .message:last-child {
      margin-bottom: 0;
    }
    .chat-pane .message.user {
      margin-left: 2rem;
      padding: 0.5rem 0.75rem;
      background: #f0ebe3;
      border-radius: 8px;
      border-bottom-right-radius: 2px;
    }
    .chat-pane .message.assistant {
      margin-right: 2rem;
      padding: 0.5rem 0.75rem;
      background: #f8f4ef;
      border: 1px solid #e0d6c8;
      border-radius: 8px;
      border-bottom-left-radius: 2px;
    }
    .chat-pane .message.assistant.safety {
      border-left: 4px solid #c45c3e;
      background: #fef8f6;
    }
    .chat-pane .message-label {
      font-size: 0.75rem;
      font-weight: 600;
      color: #6b5b4a;
      margin-bottom: 0.25rem;
    }
    .chat-pane .message-content {
      word-wrap: break-word;
    }
    .chat-pane .message.assistant .message-content {
      white-space: normal;
    }
    .chat-pane .message-content p { margin: 0.5em 0; }
    .chat-pane .message-content p:first-child { margin-top: 0; }
    .chat-pane .message-content p:last-child { margin-bottom: 0; }
    .chat-pane .message-content ul, .chat-pane .message-content ol {
      margin: 0.5em 0;
      padding-left: 1.5em;
    }
    .chat-pane .message-content li { margin: 0.25em 0; }
    .form-row {
      display: flex;
      gap: 0.5rem;
      align-items: flex-end;
      margin-bottom: 0.5rem;
    }
    .query-wrap {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-width: 0;
    }
    .query-box {
      position: relative;
      border: 1px solid #d4c9b8;
      border-radius: 6px;
      background: #fff;
      min-height: 44px;
    }
    .query-box:focus-within {
      border-color: #8b7355;
      box-shadow: 0 0 0 2px rgba(139, 115, 85, 0.2);
    }
    .add-image-btn {
      position: absolute;
      left: 0.5rem;
      top: 0.5rem;
      width: 28px;
      height: 28px;
      padding: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: transparent;
      color: #6b5b4a;
      border: 1px solid #d4c9b8;
      border-radius: 6px;
      font-size: 1.25rem;
      line-height: 1;
      cursor: pointer;
      transition: background 0.15s, color 0.15s, border-color 0.15s;
    }
    .add-image-btn:hover {
      background: #f0ebe3;
      color: #5c4a32;
      border-color: #8b7355;
    }
    #imageInput {
      position: absolute;
      width: 0;
      height: 0;
      opacity: 0;
      pointer-events: none;
    }
    .query-box-inner {
      display: flex;
      flex-direction: column;
      padding: 0.5rem 0.75rem 0.5rem 2.75rem;
    }
    .query-box-inner.has-images {
      padding-top: 0.5rem;
    }
    .image-preview-inline {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      margin-bottom: 0.5rem;
    }
    .image-preview-inline:empty {
      display: none;
    }
    textarea#message {
      width: 100%;
      min-height: 36px;
      max-height: 200px;
      padding: 0.25rem 0;
      border: none;
      font: inherit;
      font-size: 0.95rem;
      resize: none;
      overflow-y: auto;
      background: transparent;
    }
    textarea#message:focus {
      outline: none;
    }
    .form-row button {
      flex-shrink: 0;
    }
    button {
      padding: 0.6rem 1rem;
      background: #5c4a32;
      color: #fff;
      border: none;
      border-radius: 6px;
      font: inherit;
      font-weight: 600;
      cursor: pointer;
    }
    button:hover { background: #6b5b4a; }
    #clear {
      background: #8b7355;
    }
    #clear:hover { background: #6b5b4a; }
    button:disabled {
      background: #a89f8e;
      cursor: not-allowed;
    }
    .error {
      color: #b33;
      font-size: 0.9rem;
      margin-top: 0.5rem;
    }
    .status {
      font-size: 0.8rem;
      color: #6b5b4a;
      margin-top: 0.25rem;
    }
    .image-preview-item {
      position: relative;
      width: 80px;
      height: 80px;
    }
    .image-preview-item img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 6px;
      border: 1px solid #d4c9b8;
    }
    .image-preview-item .remove-img {
      position: absolute;
      top: 2px;
      right: 2px;
      width: 20px;
      height: 20px;
      padding: 0;
      font-size: 0.75rem;
      line-height: 1;
      background: rgba(0,0,0,0.6);
      color: #fff;
      border: none;
      border-radius: 50%;
      cursor: pointer;
    }
    .image-preview-item .remove-img:hover {
      background: rgba(0,0,0,0.8);
    }
    .chat-pane .message-content img.msg-img {
      max-width: 120px;
      max-height: 120px;
      border-radius: 6px;
      border: 1px solid #e0d6c8;
      display: block;
    }
    .chat-pane .message.user .message-images {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      margin-bottom: 0.5rem;
    }
    .chat-pane .message.user .message-images:only-child {
      margin-bottom: 0;
    }
    .chat-pane .message.user .message-text {
      white-space: pre-wrap;
      word-wrap: break-word;
    }
  </style>
</head>
<body>
  <h1>Vintage Coach Bag Q&A</h1>
  <p class="subtitle">Ask about serial numbers, era, hardware, damage inspection, or care for vintage Coach bags (pre-2000).</p>

  <div id="chatPane" class="chat-pane empty" aria-live="polite">Ask a question below. I can help with serial/style numbers, authenticity markers, condition, and care.</div>

  <form id="form" action="#" method="post">
    <div class="form-row">
      <div class="query-wrap">
        <div class="query-box">
          <button type="button" class="add-image-btn" id="addImageBtn" title="Add images" aria-label="Add images">+</button>
          <input type="file" id="imageInput" accept="image/jpeg,image/png,image/webp" multiple aria-label="Attach images">
          <div class="query-box-inner" id="queryBoxInner">
            <div id="imagePreview" class="image-preview-inline"></div>
            <textarea
              name="message"
              id="message"
              placeholder="e.g. What does F5D-9966 mean on my Coach bag?"
              rows="1"
              autocomplete="off"
            ></textarea>
          </div>
        </div>
      </div>
      <button type="submit" id="submit">Ask</button>
      <button type="button" id="clear">Clear</button>
    </div>
  </form>

  <p id="status" class="status" aria-live="polite"></p>
  <p id="error" class="error" aria-live="assertive" hidden></p>

  <script src="https://cdn.jsdelivr.net/npm/marked@9.1.6/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3/dist/purify.min.js"></script>
  <script>
    const form = document.getElementById("form");
    const messageInput = document.getElementById("message");
    const imageInput = document.getElementById("imageInput");
    const addImageBtn = document.getElementById("addImageBtn");
    const queryBoxInner = document.getElementById("queryBoxInner");
    const imagePreview = document.getElementById("imagePreview");
    const chatPane = document.getElementById("chatPane");
    const statusEl = document.getElementById("status");
    const errorEl = document.getElementById("error");
    const submitBtn = document.getElementById("submit");
    const clearBtn = document.getElementById("clear");

    const EMPTY_TEXT = "Ask a question below. I can help with serial/style numbers, authenticity markers, condition, and care.";
    const MAX_IMAGES = 5;
    const MAX_IMAGE_SIZE = 4 * 1024 * 1024;  // 4MB per image

    let sessionId = null;
    let pendingImages = [];  // [{ dataUrl, file }]

    function resizeTextarea() {
      messageInput.style.height = "auto";
      messageInput.style.height = Math.min(messageInput.scrollHeight, 200) + "px";
    }

    function addImageFromFile(file) {
      if (pendingImages.length >= MAX_IMAGES) return;
      if (!file.type.startsWith("image/")) return;
      if (file.size > MAX_IMAGE_SIZE) return;
      const reader = new FileReader();
      reader.onload = (e) => {
        pendingImages.push({ dataUrl: e.target.result, file });
        renderImagePreview();
      };
      reader.readAsDataURL(file);
    }

    function renderImagePreview() {
      imagePreview.innerHTML = "";
      queryBoxInner.classList.toggle("has-images", pendingImages.length > 0);
      for (let i = 0; i < pendingImages.length; i++) {
        const item = document.createElement("div");
        item.className = "image-preview-item";
        const img = document.createElement("img");
        img.src = pendingImages[i].dataUrl;
        img.alt = "Preview";
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "remove-img";
        btn.textContent = "×";
        btn.setAttribute("aria-label", "Remove image");
        const idx = i;
        btn.addEventListener("click", () => {
          pendingImages.splice(idx, 1);
          renderImagePreview();
        });
        item.appendChild(img);
        item.appendChild(btn);
        imagePreview.appendChild(item);
      }
    }

    addImageBtn.addEventListener("click", () => imageInput.click());

    imageInput.addEventListener("change", () => {
      const files = Array.from(imageInput.files || []);
      for (const file of files) addImageFromFile(file);
      imageInput.value = "";
    });

    messageInput.addEventListener("paste", (e) => {
      const items = e.clipboardData?.items;
      if (!items) return;
      for (const item of items) {
        if (item.type.startsWith("image/")) {
          e.preventDefault();
          const file = item.getAsFile();
          if (file) addImageFromFile(file);
          break;
        }
      }
    });

    messageInput.addEventListener("input", resizeTextarea);
    messageInput.addEventListener("keydown", (e) => {
      if (e.key === "Enter" && !e.shiftKey) {
        e.preventDefault();
        form.dispatchEvent(new Event("submit"));
      }
    });

    function renderMarkdown(text) {
      let s = text || "";
      try {
        if (typeof marked === "undefined" || typeof DOMPurify === "undefined") {
          return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
        }
        s = s.replace(/(^|\n)\s*[•◦▪]\s*/g, "$1- ");
        s = s.replace(/ [•◦▪] /g, "\n- ");
        const rawHtml = (typeof marked.parse === "function" ? marked.parse(s) : marked(s)) || s;
        return DOMPurify.sanitize(rawHtml, { ALLOWED_TAGS: ["p", "br", "strong", "em", "u", "ul", "ol", "li", "h1", "h2", "h3", "code", "pre", "a"] });
      } catch (err) {
        return (s || "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
      }
    }

    function appendMessage(role, content, isSafety, imageUrls) {
      chatPane.classList.remove("empty");
      const msgDiv = document.createElement("div");
      msgDiv.className = "message " + role;
      if (role === "assistant" && isSafety) msgDiv.classList.add("safety");
      const label = document.createElement("div");
      label.className = "message-label";
      label.textContent = role === "user" ? "You" : "Assistant";
      msgDiv.appendChild(label);
      const contentWrap = document.createElement("div");
      contentWrap.className = "message-content";
      if (role === "assistant") {
        contentWrap.innerHTML = renderMarkdown(content);
      } else {
        if (imageUrls && imageUrls.length > 0) {
          const imgWrap = document.createElement("div");
          imgWrap.className = "message-images";
          for (const url of imageUrls) {
            const img = document.createElement("img");
            img.src = url;
            img.alt = "Attached";
            img.className = "msg-img";
            imgWrap.appendChild(img);
          }
          contentWrap.appendChild(imgWrap);
        }
        if (content) {
          const textEl = document.createElement("div");
          textEl.className = "message-text";
          textEl.textContent = content;
          contentWrap.appendChild(textEl);
        }
      }
      msgDiv.appendChild(contentWrap);
      chatPane.appendChild(msgDiv);
      chatPane.scrollTop = chatPane.scrollHeight;
    }

    function setEmptyState() {
      chatPane.classList.add("empty");
      chatPane.innerHTML = EMPTY_TEXT;
    }

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const text = messageInput.value.trim();
      const imageDataUrls = pendingImages.map(p => p.dataUrl);
      if (!text && imageDataUrls.length === 0) return;

      const messageToSend = text || "What can you tell me about this?";
      pendingImages = [];
      renderImagePreview();

      chatPane.classList.remove("empty");
      if (chatPane.classList.contains("empty") || chatPane.textContent === EMPTY_TEXT) {
        chatPane.innerHTML = "";
      }
      appendMessage("user", messageToSend, false, imageDataUrls);

      const placeholder = document.createElement("div");
      placeholder.className = "message assistant";
      placeholder.innerHTML = '<div class="message-label">Assistant</div><div>…</div>';
      chatPane.appendChild(placeholder);
      chatPane.scrollTop = chatPane.scrollHeight;

      statusEl.textContent = "";
      errorEl.hidden = true;
      submitBtn.disabled = true;
      messageInput.value = "";
      resizeTextarea();

      try {
        const body = { message: messageToSend };
        if (sessionId) body.session_id = sessionId;
        if (imageDataUrls.length > 0) body.images = imageDataUrls;

        const res = await fetch("/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(body),
        });
        const data = await res.json().catch(() => ({}));

        placeholder.remove();

        if (!res.ok) {
          throw new Error(data.detail || res.statusText || "Request failed");
        }

        sessionId = data.session_id;
        appendMessage("assistant", data.response || "", data.safety_triggered, null);
        if (data.safety_triggered) {
          statusEl.textContent = "A safety message was shown for this question.";
        }
      } catch (err) {
        appendMessage("assistant", "Something went wrong.", false, null);
        errorEl.textContent = err.message;
        errorEl.hidden = false;
      } finally {
        submitBtn.disabled = false;
        messageInput.focus();
      }
    });

    clearBtn.addEventListener("click", async () => {
      if (!sessionId) {
        setEmptyState();
        statusEl.textContent = "";
        return;
      }
      try {
        await fetch("/clear?session_id=" + encodeURIComponent(sessionId), { method: "POST" });
        sessionId = null;
        setEmptyState();
        statusEl.textContent = "Session cleared.";
      } catch (err) {
        statusEl.textContent = "Could not clear session.";
      }
    });
  </script>
</body>
</html>
